<!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>
</head>
<body>

    <h1>Employee Management System</h1>

    <div>
        <button onclick="renderEmployeeList(employees)">Display Employees</button>
        <button onclick="calculateTotalSalaries()">Calculate Total Salaries</button>
        <!-- Pass the specific department name directly into the reusable function -->
        <button onclick="displayEmployeesByDepartment('HR')">Display HR Employees</button>
        <button onclick="displayEmployeesByDepartment('IT')">Display IT Employees</button>
        <button onclick="displayEmployeesByDepartment('Automobile')">Display AUTOMOBILE Employees</button>
        
        <input type="number" id="searchId" placeholder="Enter Employee ID">
        <button onclick="findEmployeeById(Number(document.getElementById('searchId').value))">Search by ID</button>
    </div>

    <div id="employeesDetails"></div>

    <!-- 1. First link your data array source file -->
    <script src="./employee_details.js"></script>

    <!-- 2. Clean, centralized logic functions -->
    <script>
        const employees = [
            { id: 1, name: 'John Timothy', department: 'IT', salary: 5000 },
            { id: 2, name: 'Mary Samuel', department: 'HR', salary: 6000 },
            { id: 3, name: 'Henry Joshua', department: 'HR', salary: 4500 },
            { id: 4, name: 'Emma Watson', department: 'Marketing', salary: 5500 },
            { id: 5, name: 'Donald Trump', department: 'Automobile', salary: 6000 }
        ];

        // Core UI rendering function shared by all display actions
        function renderEmployeeList(employeeArray, emptyMessage = 'No employees found.') {
            if (employeeArray.length === 0) {
                document.getElementById('employeesDetails').innerHTML = `<p>${emptyMessage}</p>`;
                return;
            }
            
            const htmlContent = employeeArray
                .map(emp => `<p>${emp.id}: ${emp.name} - ${emp.department} - $${emp.salary}</p>`)
                .join('');
                
            document.getElementById('employeesDetails').innerHTML = htmlContent;
        }

        // Reusable department filter
        function displayEmployeesByDepartment(departmentName) {
            const filtered = employees.filter(
                emp => emp.department.toLowerCase() === departmentName.toLowerCase()
            );
            renderEmployeeList(filtered, `No employees found in the ${departmentName} department.`);
        }

        function calculateTotalSalaries() {
            const totalSalaries = employees.reduce((acc, emp) => acc + emp.salary, 0);
            alert(`Total Salaries: $${totalSalaries}`);
        }

        function findEmployeeById(employeeId) {
            const foundEmployee = employees.find(emp => emp.id === employeeId);
            // We pass the single employee inside an array to reuse our rendering function safely
            if (foundEmployee) {
                renderEmployeeList([foundEmployee]);
            } else {
                renderEmployeeList([], 'No employee has been found with this ID');
            }
        }
    </script>
</body>
</html>
