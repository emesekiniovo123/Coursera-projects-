<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Weather Report</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 640px; margin: 2rem; }
    label, input, button { font-size: 1rem; }
    #weatherInfo { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Weather Report</h1>

  <form id="weatherForm">
    <label for="city">Enter City:</label>
    <input type="text" id="city" name="city" autocomplete="on" />
    <button type="submit">Search city</button>
  </form>

  <div id="weatherInfo" aria-live="polite"></div>

  <script>
    
    const API_KEY = '2879d7be88fd927cf07d32ab2a6a077d';

    document.getElementById('weatherForm').addEventListener('submit', showWeatherDetails);

    async function showWeatherDetails(event) {
      event.preventDefault();

      const weatherInfo = document.getElementById('weatherInfo');
      const city = document.getElementById('city').value.trim();

      if (!city) {
        weatherInfo.innerHTML = '<p>City not found.</p>';
        return;
      }

      weatherInfo.innerHTML = '<p>Loading weather…</p>';

      const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`;

      try {
        const response = await fetch(apiUrl);

        if (!response.ok) {
          // Try to parse error body (OpenWeatherMap returns JSON with message)
          let errMsg = `HTTP ${response.status} ${response.statusText}`;
          try {
            const errBody = await response.json();
            if (errBody && errBody.message) errMsg = errBody.message;
          } catch (_) {}
          throw new Error(errMsg);
        }

        const data = await response.json();

        // OpenWeatherMap may return a numeric 'cod' with error code as well
        if (data.cod && Number(data.cod) !== 200) {
          throw new Error(data.message || 'Failed to fetch weather data');
        }

        weatherInfo.innerHTML = `
          <h2>Weather in ${escapeHtml(data.name)}</h2>
          <p>Temperature: ${data.main.temp} &#8451;</p>
          <p>Weather: ${escapeHtml(data.weather[0].description)}</p>
        `;
      } catch (error) {
        console.error('Error fetching weather:', error);
        weatherInfo.innerHTML = `<p>Failed to fetch weather: ${escapeHtml(String(error.message || error))}</p>`;
      }
    }

    // Minimal HTML-escaping for inserted text
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
