<html>
<head>
  <title>Rectangle Area Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #555;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease;
      background: #f9f9f9;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 25px;
      padding: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      border-radius: 8px;
      min-height: 24px;
      color: #333;
    }

    #result.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #4caf50;
    }

    #result.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #f44336;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📐 Rectangle Area Calculator</h1>
    
    <div class="form-group">
      <label for="length">Enter the length in metres:</label>
      <input type="number" id="length" placeholder="e.g., 10">
    </div>

    <div class="form-group">
      <label for="width">Enter the width in metres:</label>
      <input type="number" id="width" placeholder="e.g., 5">
    </div>

    <button onclick="calculateArea()">Calculate Area</button>

    <p id="result"></p>
  </div>

  <script>
    function calculateArea() {
      const length = document.getElementById('length').value;
      const width = document.getElementById('width').value;
      const resultElement = document.getElementById('result');

      if (length === '' || width === '') {
        resultElement.textContent = 'Please enter both length and width';
        resultElement.className = 'error';
        return;
      }

      if (length <= 0 || width <= 0) {
        resultElement.textContent = 'Length and width must be greater than 0';
        resultElement.className = 'error';
        return;
      }

      const area = length * width;
      resultElement.textContent = `Area: ${area} square metres`;
      resultElement.className = 'success';
    }

    // Allow Enter key to calculate
    document.getElementById('length').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') calculateArea();
    });
    document.getElementById('width').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') calculateArea();
    });
  </script>
</body>
</html>
