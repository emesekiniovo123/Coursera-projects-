
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Management System</title>
    <style>
        * {
            margin: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .form-section {
            background: cyan;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            font-family: inherit;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .books-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .books-section h2 {
            color: #2f0;
            margin-bottom: 25px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .book-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .book-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .book-card h3 {
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 12px;
        }

        .book-card p {
            color: #555;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .book-card strong {
            color: #333;
        }

        .book-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn-edit {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-edit:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #ee5a52;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 1.1em;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .form-section,
            .books-section {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body id="learn">
    <div class="container">
        <h1>📚 Book Management System</h1>
        
        <div class="form-section">
            <div class="form-group">
                <label for="bookName">Book Name:</label>
                <input type="text" id="bookName" placeholder="Enter book name">
            </div>
            <div class="form-group">
                <label for="authorName">Author Name:</label>
                <textarea id="authorName" placeholder="Enter author name"></textarea>
            </div>
            <div class="form-group">
                <label for="bookDescription">Book Description:</label>
                <textarea id="bookDescription" placeholder="Enter book description"></textarea>
            </div>
            <div class="form-group">
                <label for="pagesNumber">No. of Pages:</label>
                <input type="number" id="pagesNumber" placeholder="Enter number of pages">
            </div>
            <div class="button-group">
                <button class="btn-add" onclick="addBook()">+ Add Book</button>
            </div>
        </div>

        <div class="books-section">
            <h2>Books</h2>
            <div id="books">
                <div class="empty-state">
                    <p>No books added yet. Start by adding your first book!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let books = [];

        function addBook() {
            const bookName = document.getElementById('bookName').value.trim();
            const authorName = document.getElementById('authorName').value.trim();
            const bookDescription = document.getElementById('bookDescription').value.trim();
            const pagesNumber = parseInt(document.getElementById('pagesNumber').value);
            
            if (bookName && authorName && bookDescription && !isNaN(pagesNumber)) {
                const book = {
                    name: bookName,
                    authorName: authorName,
                    bookDescription: bookDescription,
                    pagesNumber: pagesNumber
                };
                books.push(book);
                showbooks();
                clearInputs();
            } else {
                alert('All fields are mandatory.');
            }
        }

        function showbooks() {
            if (books.length === 0) {
                document.getElementById('books').innerHTML = '<div class="empty-state"><p>No books added yet. Start by adding your first book!</p></div>';
                return;
            }

            const booksDiv = books.map((book, index) => `
                <div class="book-card">
                    <h3>Book #${index + 1}</h3>
                    <p><strong>Book Name:</strong> ${book.name}</p>
                    <p><strong>Author Name:</strong> ${book.authorName}</p>
                    <p><strong>Book Description:</strong> ${book.bookDescription}</p>
                    <p><strong>No. of Pages:</strong> ${book.pagesNumber} page(s)</p>
                    <div class="book-actions">
                        <button class="btn-edit" onclick="editbook(${index})">Edit</button>
                        <button class="btn-delete" onclick="deletebook(${index})">Delete</button>
                    </div>
                </div>
            `);
            document.getElementById('books').innerHTML = booksDiv.join('');
        }

        function editbook(index) {
            const book = books[index];
            document.getElementById('bookName').value = book.name;
            document.getElementById('authorName').value = book.authorName;
            document.getElementById('bookDescription').value = book.bookDescription;
            document.getElementById('pagesNumber').value = book.pagesNumber;
            books.splice(index, 1);
            showbooks();
            document.getElementById('bookName').focus();
        }

        function deletebook(index) {
            if (confirm('Are you sure you want to delete this book?')) {
                books.splice(index, 1);
                showbooks();
            }
        }

        function clearInputs() {
            document.getElementById('bookName').value = '';
            document.getElementById('authorName').value = '';
            document.getElementById('bookDescription').value = '';
            document.getElementById('pagesNumber').value = '';
        }
    </script>
    <footer>
         <p>&copy; 2026 BookVerse. Built with Vanilla JAVASCRIPT by Josiah.</p>

    </footer>
</body>
</html>
